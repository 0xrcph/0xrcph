<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="cs2-config: autoexec and offline practice configs for Counter-Strike 2, with a web crosshair and config builder">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#3fe08a"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'Cascadia Code','SF Mono',Consolas,'Liberation Mono',monospace; }
    .name { font-size: 22px; font-weight: 700; fill: #e6edf3; }
    .desc { font-size: 14px; fill: #8b949e; }
    .meta { font-size: 12px; fill: #8b949e; }
    .glow { animation: glow 3.5s ease-in-out infinite; }
    @keyframes glow { 0%,100% { stroke-opacity: 0.25; } 50% { stroke-opacity: 0.9; } }
    .blink { animation: blink 1.2s steps(2,start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
  </style>

  <rect x="1.5" y="1.5" width="897" height="147" rx="12" fill="#0d1117" stroke="url(#edge)" stroke-width="1.5" class="glow"/>

  <g class="mono">
    <text x="32" y="44" class="meta">~/projects/</text>
    <text x="32" y="74" class="name">cs2-config<tspan fill="#f5a623" class="blink">_</tspan></text>
    <text x="32" y="100" class="desc">Autoexec and offline practice configs for Counter-Strike 2,</text>
    <text x="32" y="120" class="desc">plus a web crosshair and config builder.</text>

    <circle cx="700" cy="40" r="5" fill="#f5a623"/>
    <text x="714" y="44" class="meta">Counter-Strike 2</text>
  </g>

  <!-- animated crosshair -->
  <g transform="translate(790 98)">
    <circle r="34" fill="none" stroke="#f5a623" stroke-opacity="0.18"/>
    <g stroke="#3fe08a" stroke-width="2.5" stroke-linecap="round">
      <line x1="-5" y1="0" x2="-15" y2="0"><animate attributeName="x1" values="-5;-10;-5" dur="2.4s" repeatCount="indefinite"/><animate attributeName="x2" values="-15;-20;-15" dur="2.4s" repeatCount="indefinite"/></line>
      <line x1="5" y1="0" x2="15" y2="0"><animate attributeName="x1" values="5;10;5" dur="2.4s" repeatCount="indefinite"/><animate attributeName="x2" values="15;20;15" dur="2.4s" repeatCount="indefinite"/></line>
      <line x1="0" y1="-5" x2="0" y2="-15"><animate attributeName="y1" values="-5;-10;-5" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y2" values="-15;-20;-15" dur="2.4s" repeatCount="indefinite"/></line>
      <line x1="0" y1="5" x2="0" y2="15"><animate attributeName="y1" values="5;10;5" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y2" values="15;20;15" dur="2.4s" repeatCount="indefinite"/></line>
    </g>
    <circle r="1.6" fill="#3fe08a"/>
    <circle r="6" fill="none" stroke="#f5a623" stroke-width="1.6" opacity="0">
      <animate attributeName="r" values="6;32" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
