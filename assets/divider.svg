<svg xmlns="http://www.w3.org/2000/svg" width="900" height="20" viewBox="0 0 900 20" role="presentation">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb9a8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3fb9a8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3fb9a8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#3fb9a8"/>
      <stop offset="1" stop-color="#3fb9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="9.5" width="900" height="1" fill="url(#fade)"/>
  <circle r="9" cy="10" fill="url(#glow)">
    <animate attributeName="cx" values="0;900" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" cy="10" fill="#e6edf3">
    <animate attributeName="cx" values="0;900" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
