<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Animated illustration of a nerdy kid with glasses and headphones typing code on a laptop at night">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#14202e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fb9a8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3fb9a8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="900" height="320" rx="14"/></clipPath>
    <clipPath id="screen"><rect x="450" y="124" width="132" height="102" rx="3"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'Cascadia Code','SF Mono',Consolas,'Liberation Mono',monospace; }
    .float { font-size: 14px; fill: #3fb9a8; opacity: 0; }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="320" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#e6edf3">
      <circle cx="60" cy="40" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="90" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="30" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="64" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="28" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="36" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="100" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="130" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="90" cy="150" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="170" cy="200" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="210" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="60" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- moon -->
    <path d="M800 38 A24 24 0 1 0 824 72 A19 19 0 1 1 800 38 Z" fill="#e6edf3" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- laptop glow on the scene -->
    <ellipse cx="515" cy="190" rx="190" ry="110" fill="url(#glow)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
    </ellipse>

    <!-- floating code glyphs -->
    <g class="mono float">
      <text x="450" y="120">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0 0;12 -90" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="5s" repeatCount="indefinite"/></text>
      <text x="500" y="120">{ }<animateTransform attributeName="transform" type="translate" values="0 0;-8 -100" dur="6s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="6s" begin="-2s" repeatCount="indefinite"/></text>
      <text x="545" y="120">0x1f<animateTransform attributeName="transform" type="translate" values="0 0;10 -85" dur="5.5s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="5.5s" begin="-1s" repeatCount="indefinite"/></text>
      <text x="480" y="120">sudo<animateTransform attributeName="transform" type="translate" values="0 0;-14 -95" dur="6.5s" begin="-3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="6.5s" begin="-3.5s" repeatCount="indefinite"/></text>
      <text x="565" y="120">$_<animateTransform attributeName="transform" type="translate" values="0 0;6 -105" dur="7s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="7s" begin="-4s" repeatCount="indefinite"/></text>
      <text x="520" y="120">101<animateTransform attributeName="transform" type="translate" values="0 0;-4 -80" dur="4.5s" begin="-0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="4.5s" begin="-0.5s" repeatCount="indefinite"/></text>
    </g>

    <!-- desk -->
    <rect x="0" y="246" width="900" height="74" fill="#10161f"/>
    <rect x="0" y="246" width="900" height="3" fill="#3fb9a8" opacity="0.5"/>

    <!-- chair back -->
    <rect x="262" y="150" width="14" height="100" rx="7" fill="#21262d"/>

    <!-- body -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 1.2;0 0" dur="3s" repeatCount="indefinite"/>
      <!-- legs / seat -->
      <rect x="290" y="236" width="120" height="16" rx="8" fill="#1d2430"/>
      <!-- torso -->
      <path d="M274 252 L274 176 C274 152 292 143 312 143 L338 143 C352 143 362 157 362 177 L362 252 Z" fill="#2f3b4a"/>
      <ellipse cx="292" cy="152" rx="22" ry="16" fill="#263140"/>
      <path d="M326 150 V176 M334 150 V172" stroke="#3fb9a8" stroke-width="2" stroke-linecap="round"/>

      <!-- back arm -->
      <polyline points="338,172 352,212 416,224" fill="none" stroke="#263140" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.5s" begin="0.25s" repeatCount="indefinite"/>
      </polyline>

      <!-- head -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 1.5;0 0" dur="2.2s" repeatCount="indefinite"/>
        <rect x="315" y="126" width="18" height="20" fill="#e0ac69"/>
        <circle cx="325" cy="100" r="34" fill="#f1c27d"/>
        <!-- nose -->
        <path d="M357 104 L366 112 L357 114 Z" fill="#e0ac69"/>
        <!-- ear -->
        <ellipse cx="311" cy="106" rx="5" ry="7" fill="#e0ac69"/>
        <!-- hair -->
        <path d="M291 102 C287 66 312 54 334 58 C354 60 362 78 358 94 C346 82 331 80 319 86 C306 88 296 96 291 108 Z" fill="#20242e"/>
        <!-- headphones -->
        <path d="M295 98 C294 58 352 54 357 90" fill="none" stroke="#3fb9a8" stroke-width="5" stroke-linecap="round"/>
        <circle cx="311" cy="106" r="13" fill="#1f6f66" stroke="#3fb9a8" stroke-width="2.5"/>
        <!-- glasses -->
        <path d="M336 99 L314 96" stroke="#e6edf3" stroke-width="2" stroke-linecap="round"/>
        <circle cx="347" cy="101" r="10.5" fill="#58a6ff" fill-opacity="0.18" stroke="#e6edf3" stroke-width="2.2"/>
        <path d="M341 96 L346 91" stroke="#e6edf3" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
        <!-- eye -->
        <ellipse cx="349" cy="102" rx="2.6" ry="3" fill="#1a1f29">
          <animate attributeName="ry" values="3;3;0.3;3" keyTimes="0;0.92;0.96;1" dur="4s" repeatCount="indefinite"/>
        </ellipse>
        <!-- mouth -->
        <path d="M347 122 q5 3 10 0" fill="none" stroke="#8a5a2b" stroke-width="1.8" stroke-linecap="round"/>
      </g>

      <!-- front arm -->
      <polyline points="344,172 360,214 428,226" fill="none" stroke="#2f3b4a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.5s" repeatCount="indefinite"/>
      </polyline>
      <circle cx="430" cy="226" r="6" fill="#f1c27d">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- laptop -->
    <g>
      <path d="M404 244 L612 244 L600 232 L416 232 Z" fill="#21262d" stroke="#3fb9a8" stroke-opacity="0.6"/>
      <rect x="444" y="118" width="144" height="114" rx="7" fill="#0b1016" stroke="#3fb9a8" stroke-opacity="0.7" stroke-width="1.5"/>
      <rect x="450" y="124" width="132" height="102" rx="3" fill="#080c11"/>

      <!-- scrolling code -->
      <g clip-path="url(#screen)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -66" dur="3.2s" repeatCount="indefinite"/>
          <g id="block">
            <rect x="458" y="130" width="40" height="5" rx="2" fill="#ff7b72"/><rect x="502" y="130" width="28" height="5" rx="2" fill="#8b949e"/>
            <rect x="468" y="141" width="62" height="5" rx="2" fill="#3fb9a8"/>
            <rect x="468" y="152" width="34" height="5" rx="2" fill="#58a6ff"/><rect x="506" y="152" width="40" height="5" rx="2" fill="#e6edf3" opacity="0.6"/>
            <rect x="478" y="163" width="70" height="5" rx="2" fill="#d2a8ff"/>
            <rect x="458" y="174" width="26" height="5" rx="2" fill="#ff7b72"/><rect x="488" y="174" width="50" height="5" rx="2" fill="#8b949e"/>
          </g>
          <use href="#block" y="66"/>
          <use href="#block" y="132"/>
        </g>
      </g>
      <rect x="450" y="124" width="132" height="102" rx="3" fill="none" stroke="#3fb9a8" stroke-opacity="0.15"/>
      <!-- screen scanline -->
      <rect x="450" y="124" width="132" height="2" fill="#3fb9a8" opacity="0.25" clip-path="url(#screen)">
        <animate attributeName="y" values="124;226" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- mug with steam -->
    <g>
      <rect x="650" y="216" width="26" height="30" rx="5" fill="#21262d" stroke="#3fb9a8" stroke-width="1.5"/>
      <path d="M676 224 q10 2 0 14" fill="none" stroke="#3fb9a8" stroke-width="2"/>
      <g fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" opacity="0">
        <path d="M657 210 q-5 -8 0 -14">
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -14" dur="2.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.7;0" dur="2.4s" repeatCount="indefinite"/>
        </path>
        <path d="M667 210 q5 -8 0 -14">
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -14" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.7;0" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- tiny plant -->
    <g>
      <rect x="722" y="226" width="22" height="20" rx="3" fill="#21262d" stroke="#3fb9a8" stroke-opacity="0.6"/>
      <g stroke="#3fb9a8" stroke-width="2.5" stroke-linecap="round" fill="none">
        <path d="M733 226 Q725 212 719 206"><animate attributeName="d" values="M733 226 Q725 212 719 206;M733 226 Q726 211 722 205;M733 226 Q725 212 719 206" dur="4s" repeatCount="indefinite"/></path>
        <path d="M733 226 Q733 210 733 200"/>
        <path d="M733 226 Q741 212 747 206"><animate attributeName="d" values="M733 226 Q741 212 747 206;M733 226 Q740 211 744 205;M733 226 Q741 212 747 206" dur="4.5s" repeatCount="indefinite"/></path>
      </g>
    </g>

    <rect x="1" y="1" width="898" height="318" rx="13" fill="none" stroke="#3fb9a8" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>
</svg>
